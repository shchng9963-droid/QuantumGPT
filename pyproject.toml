[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumgpt"
version = "0.1.0"
description = "QuantumGPT — AI agent for quantum computing hardware"
requires-python = ">=3.11"
dependencies = [
    "qiskit==1.3.0",
    "qiskit-dynamics==0.6.0",
    "qiskit-ibm-runtime==0.29.1",
    "qiskit-aer==0.17.2",
    "duckdb>=1.5",
    "numpy>=2.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "click>=8.0",
    "rich>=13.0",
    "openai>=1.0",
    "anthropic>=0.40",
]

[project.scripts]
qgpt = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["agent", "advisor", "backends", "bench", "data", "dynamics", "eval", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
